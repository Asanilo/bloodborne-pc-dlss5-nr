    <path d="M740 330V265h30V188l18-53 18 53v61h22V208h25v-31l17-18 17 18v77h26V169l22-76 22 76v106h29V221h23V176l18-37 18 37v76h30V208h22v-30l23-63 23 63v115h28v-54h20v-39h19v-29l17-58 17 58v110h27v49Z" fill="#050a0e"/>
    <path d="M935 93V66m-10 12h20m155 37V94m-8 11h16" stroke="#7b8e90" stroke-opacity=".45" stroke-width="2"/>
    <path d="M0 306H1200" stroke="#9f895d" stroke-opacity=".18"/>
