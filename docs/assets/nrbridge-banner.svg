    <radialGradient id="moon"><stop stop-color="#b6c7c8" stop-opacity=".13"/><stop offset="1" stop-color="#b6c7c8" stop-opacity="0"/></radialGradient>
    <linearGradient id="gold"><stop stop-color="#ebdfc0"/><stop offset="1" stop-color="#b69a66"/></linearGradient>
    <clipPath id="edge"><rect width="1200" height="330" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#edge)">
