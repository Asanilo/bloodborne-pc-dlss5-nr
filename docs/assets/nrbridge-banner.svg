<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Bloodborne · DLSS 5 NRBridge · Native Linux</title>
  <desc id="desc">A moonlit skyline with the Bloodborne and NRBridge names, and Linux, DLSS SR plus NR, and bbport 0.6 labels.</desc>
  <defs>
